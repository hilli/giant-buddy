# https://taskfile.dev
version: "3"

vars:
  PROJECT: GiantLogger.xcodeproj
  SCHEME: GiantLogger
  BUNDLE_ID: dk.hilli.GiantLogger
  DESTINATION: "generic/platform=iOS"
  ARCHIVE_PATH: build/GiantLogger.xcarchive
  EXPORT_PATH: build/exports

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build debug configuration
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination '{{.DESTINATION}}'
        -allowProvisioningUpdates
        {{.CLI_ARGS}}

  build:release:
    desc: Build release configuration
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Release
        -destination '{{.DESTINATION}}'
        -allowProvisioningUpdates
        {{.CLI_ARGS}}

  build:quiet:
    desc: Build debug (quiet output)
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination '{{.DESTINATION}}'
        -allowProvisioningUpdates
        -quiet

  test:
    desc: Run unit tests in the iOS Simulator
    vars:
      SIM_DEST: '{{.SIM_DEST | default "platform=iOS Simulator,name=iPhone 17 Pro Max"}}'
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination '{{.SIM_DEST}}'
        -only-testing:GiantLoggerTests
        test
        {{.CLI_ARGS}}

  simulator:
    desc: Build and run in iOS Simulator
    vars:
      SIM_DEST: '{{.SIM_DEST | default "platform=iOS Simulator,name=iPhone 17 Pro Max"}}'
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination '{{.SIM_DEST}}'
        -derivedDataPath build/DerivedData
        -quiet
      - >-
        open -a Simulator
      - >-
        xcrun simctl install booted build/DerivedData/Build/Products/Debug-iphonesimulator/{{.SCHEME}}.app
      - >-
        xcrun simctl launch booted {{.BUNDLE_ID}}

  appstore:screenshots:
    desc: Capture App Store screenshots in the Simulator using demo data (ScreenshotMode)
    vars:
      SIM_NAME: '{{.SIM_NAME | default "iPhone 17 Pro Max"}}'
      OUT_DIR: docs/appstore/screenshots/iphone
    cmds:
      - |
        set -euo pipefail
        UDID=$(xcrun simctl list devices available | grep "{{.SIM_NAME}} (" | head -1 | grep -oE '[0-9A-F-]{36}')
        test -n "$UDID" || { echo "Simulator '{{.SIM_NAME}}' not found"; exit 1; }
        xcrun simctl boot "$UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$UDID" -b
        open -a Simulator
        xcodebuild -project {{.PROJECT}} -scheme {{.SCHEME}} -configuration Debug \
          -destination "id=$UDID" -derivedDataPath build/DerivedData -quiet build
        xcrun simctl install "$UDID" build/DerivedData/Build/Products/Debug-iphonesimulator/{{.SCHEME}}.app
        xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 \
          --cellularBars 4 --wifiBars 3 --dataNetwork wifi
        xcrun simctl location "$UDID" set 55.6761,12.5683
        xcrun simctl privacy "$UDID" grant location-always {{.BUNDLE_ID}} || true
        mkdir -p {{.OUT_DIR}}
        i=0
        for name in 01-ride 02-routes 03-history 04-bike 05-settings; do
          xcrun simctl terminate "$UDID" {{.BUNDLE_ID}} 2>/dev/null || true
          xcrun simctl launch "$UDID" {{.BUNDLE_ID}} -ScreenshotMode YES -autoRecord NO \
            -autoConnectEnabled NO -ScreenshotTab "$i" -AppleLanguages "(en)" -AppleLocale en_GB
          sleep 10
          xcrun simctl io "$UDID" screenshot "{{.OUT_DIR}}/$name.png"
          i=$((i + 1))
        done
        xcrun simctl terminate "$UDID" {{.BUNDLE_ID}} 2>/dev/null || true
        xcrun simctl status_bar "$UDID" clear

  appstore:push:
    desc: Push App Store metadata + screenshots via App Store Connect API (pass -- --dry-run to preview)
    preconditions:
      - sh: command -v uv
        msg: "uv not found. Install with: brew install uv (or mise use uv)"
    cmds:
      - uv run scripts/appstore_push.py {{.CLI_ARGS}}

  clean:
    desc: Clean build artifacts
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        clean
        -quiet
      - rm -rf build/

  archive:
    desc: Create xcarchive for distribution
    cmds:
      - mkdir -p build
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Release
        -destination '{{.DESTINATION}}'
        -archivePath {{.ARCHIVE_PATH}}
        -allowProvisioningUpdates
        archive

  export:
    desc: Export archive for ad-hoc distribution
    deps: [archive]
    cmds:
      - >-
        xcodebuild
        -exportArchive
        -archivePath {{.ARCHIVE_PATH}}
        -exportPath {{.EXPORT_PATH}}
        -exportOptionsPlist ExportOptions.plist
        -allowProvisioningUpdates

  testflight:
    desc: Archive and upload to App Store Connect for TestFlight
    deps: [archive]
    cmds:
      - >-
        xcodebuild
        -exportArchive
        -archivePath {{.ARCHIVE_PATH}}
        -exportPath {{.EXPORT_PATH}}
        -exportOptionsPlist ExportOptions-AppStore.plist
        -allowProvisioningUpdates

  release:
    desc: Clean build, archive, and export
    cmds:
      - task: clean
      - task: export

  lint:
    desc: Lint Swift code with SwiftLint
    preconditions:
      - sh: command -v swiftlint
        msg: "swiftlint not found. Install with: brew install swiftlint"
    cmds:
      - swiftlint lint --strict

  lint:fix:
    desc: Auto-fix lint issues
    preconditions:
      - sh: command -v swiftlint
        msg: "swiftlint not found. Install with: brew install swiftlint"
    cmds:
      - swiftlint lint --fix

  format:
    desc: Format Swift code with SwiftFormat
    preconditions:
      - sh: command -v swiftformat
        msg: "swiftformat not found. Install with: brew install swiftformat"
    cmds:
      - swiftformat GiantLogger/

  format:check:
    desc: Check formatting without changes
    preconditions:
      - sh: command -v swiftformat
        msg: "swiftformat not found. Install with: brew install swiftformat"
    cmds:
      - swiftformat GiantLogger/ --lint

  setup:
    desc: Install development dependencies via Homebrew
    cmds:
      - brew install swiftlint swiftformat
    status:
      - command -v swiftlint
      - command -v swiftformat

  deploy:
    desc: Build and deploy to connected iOS device
    vars:
      DEVICE_ID:
        sh: xcrun devicectl list devices 2>/dev/null | awk 'NR > 2 && /iPhone/ && $0 !~ /unavailable/ && ($0 ~ /available/ || $0 ~ /connected/) { print $3; exit }'
    preconditions:
      - sh: test -n "{{.DEVICE_ID}}"
        msg: "No reachable iPhone found. Unlock/connect your phone and enable network pairing in Xcode."
    cmds:
      - echo "Deploying to device {{.DEVICE_ID}}..."
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination 'generic/platform=iOS'
        -derivedDataPath build/DerivedData
        -allowProvisioningUpdates
        -quiet
      - >-
        xcrun devicectl device install app
        --device {{.DEVICE_ID}}
        build/DerivedData/Build/Products/Debug-iphoneos/{{.SCHEME}}.app
      - >-
        xcrun devicectl device process launch
        --device {{.DEVICE_ID}}
        {{.BUNDLE_ID}}

  deploy:ota:
    desc: Build and deploy over WiFi (device must be paired)
    vars:
      DEVICE_ID:
        sh: xcrun devicectl list devices 2>/dev/null | awk 'NR > 2 && /iPhone/ && $0 !~ /unavailable/ && ($0 ~ /available/ || $0 ~ /connected/) { print $3; exit }'
    preconditions:
      - sh: test -n "{{.DEVICE_ID}}"
        msg: "No reachable iPhone found. Unlock/connect your phone and enable network pairing in Xcode."
    cmds:
      - echo "Deploying to device {{.DEVICE_ID}}..."
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Debug
        -destination 'generic/platform=iOS'
        -derivedDataPath build/DerivedData
        -allowProvisioningUpdates
        -quiet
      - >-
        xcrun devicectl device install app
        --device {{.DEVICE_ID}}
        build/DerivedData/Build/Products/Debug-iphoneos/{{.SCHEME}}.app
      - >-
        xcrun devicectl device process launch
        --device {{.DEVICE_ID}}
        {{.BUNDLE_ID}}

  deploy:release:
    desc: Build release and deploy to connected iOS device
    vars:
      DEVICE_ID:
        sh: xcrun devicectl list devices 2>/dev/null | awk 'NR > 2 && /iPhone/ && $0 !~ /unavailable/ && ($0 ~ /available/ || $0 ~ /connected/) { print $3; exit }'
    preconditions:
      - sh: test -n "{{.DEVICE_ID}}"
        msg: "No reachable iPhone found. Unlock/connect your phone and enable network pairing in Xcode."
    cmds:
      - echo "Deploying to device {{.DEVICE_ID}}..."      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration Release
        -destination 'generic/platform=iOS'
        -derivedDataPath build/DerivedData
        -allowProvisioningUpdates
        -quiet
      - >-
        xcrun devicectl device install app
        --device {{.DEVICE_ID}}
        build/DerivedData/Build/Products/Release-iphoneos/{{.SCHEME}}.app
      - >-
        xcrun devicectl device process launch
        --device {{.DEVICE_ID}}
        {{.BUNDLE_ID}}

  devices:
    desc: List connected iOS devices
    cmds:
      - echo "=== Available devices (USB + WiFi paired) ==="
      - xcrun devicectl list devices 2>/dev/null | grep -v "Simulator" || echo "No devices found"
      - echo ""
      - echo "To pair a device for WiFi deployment:"
      - echo "1. Connect device via USB"
      - echo "2. Open Xcode > Window > Devices and Simulators"
      - echo "3. Check 'Connect via network' for your device"
